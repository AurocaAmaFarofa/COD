services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Postgres instalado no Windows (fora do Docker)
      - DB_HOST=host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3000'
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
