# Configuração do Nginx (vira /etc/nginx/templates/default.conf.template na imagem).
# ${HTTPS_PORT} é trocado pela variável de ambiente ao subir o container; as variáveis
# do próprio Nginx ($host, $remote_addr...) ficam como estão.

server_tokens off;

upstream backend {
    server backend:3000;
}

# HTTP só redireciona para HTTPS: senha e cookie de sessão nunca trafegam em texto puro.
server {
    listen 80;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    # Certificado em /etc/nginx/certs (pasta ./certs do projeto). Se não houver nenhum,
    # o container gera um autoassinado ao subir (docker/15-certificado.sh).
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança da página.
    # CSP: só carrega script, estilo, fonte e conexões da própria origem e dos serviços
    # que o site usa de verdade (login do Google, fontes do Google e APIs do clima).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/ https://api.open-meteo.com https://api.met.no https://nominatim.openstreetmap.org https://ipapi.co; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    # O login do Google abre um popup e conversa com a página por ele.
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    # HSTS: ligue só com um certificado válido (de uma CA). Com o autoassinado, o
    # navegador deixaria de permitir "continuar mesmo assim" e o site ficaria inacessível.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Requisições para /api vão para o back-end. O Express manda os próprios cabeçalhos
    # de segurança (CSP mais restrita, só JSON); os do servidor acima também valem aqui.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acrescenta): o X-Forwarded-For que o cliente mandar é descartado,
        # e o back-end recebe só o IP que o Nginx viu de verdade.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto entrega o React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
